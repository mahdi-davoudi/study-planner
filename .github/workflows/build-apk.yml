name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: pip install "flet[all]" "flet-android-notifications==0.12.0"

      - name: First build (generates the Android project)
        continue-on-error: true
        run: |
          flet build apk --yes -v 2>&1 | tee first-build.log
          exit 0

      - name: Diagnostics
        if: always()
        run: |
          echo "=== folders ==="
          ls -la build || true
          ls -la build/flutter || true
          echo "=== lines with errors ==="
          grep -n -i -E "error|exception|failed|what went wrong" first-build.log | head -40 || true
          echo "=== last 50 lines ==="
          tail -n 50 first-build.log

      - name: Patch Android project for notifications
        run: flet-android-notifications-patch --project-root build/flutter

      - name: Build APK
        run: flet build apk --yes -v

      - uses: actions/upload-artifact@v4
        with:
          name: study-planner-apk
          path: build/apk